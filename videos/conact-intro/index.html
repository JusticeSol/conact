<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #F5F0E8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="el-01-who-settles-it"
        class="scene"
        data-composition-id="01-who-settles-it"
        data-composition-src="compositions/frames/01-who-settles-it.html"
        data-start="0"
        data-duration="3.9"
        data-track-index="0"
      ></div>

      <div
        id="el-02-escrow-holds"
        class="scene"
        data-composition-id="02-escrow-holds"
        data-composition-src="compositions/frames/02-escrow-holds.html"
        data-start="3.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-the-verdict"
        class="scene"
        data-composition-id="03-the-verdict"
        data-composition-src="compositions/frames/03-the-verdict.html"
        data-start="7.5"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-04-advisory-not-final"
        class="scene"
        data-composition-id="04-advisory-not-final"
        data-composition-src="compositions/frames/04-advisory-not-final.html"
        data-start="13"
        data-duration="4.9"
        data-track-index="1"
      ></div>

      <div
        id="el-05-conact"
        class="scene"
        data-composition-id="05-conact"
        data-composition-src="compositions/frames/05-conact.html"
        data-start="17.5"
        data-duration="2.5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-who-settles-it", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 3.5);
        tl.fromTo("#el-02-escrow-holds", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 3.5);
        tl.to("#el-02-escrow-holds", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.5);
        tl.fromTo("#el-03-the-verdict", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.5);
        tl.to("#el-03-the-verdict", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-04-advisory-not-final", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to("#el-04-advisory-not-final", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 17.5);
        tl.fromTo("#el-05-conact", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 17.5);
        tl.to({}, { duration: 20 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
