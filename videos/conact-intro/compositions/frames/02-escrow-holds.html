<template>
  <style>
    @font-face {
      font-family: 'Playfair Display';
      src: url('assets/fonts/PlayfairDisplay-var.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Inter';
      src: url('assets/fonts/Inter-var.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      src: url('assets/fonts/IBMPlexMono-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .f02-ground {
      position: absolute;
      inset: 0;
      background: #F5F0E8;
    }

    .f02-stage {
      position: absolute;
      inset: 0;
    }

    .f02-label {
      position: absolute;
      left: 80px;
      top: 150px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 400;
      font-size: 19px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #7A6A52;
    }

    /* the queue panel — a masked window onto the real captured column */
    .f02-queue-mask {
      position: absolute;
      left: 80px;
      top: 192px;
      width: 340px;
      /* lands on a row boundary — a half-clipped row reads as an accident */
      height: 556px;
      overflow: hidden;
    }

    .f02-queue-mask img {
      position: absolute;
      left: 0;
      top: 0;
      width: 340px;
      height: 687px;
      display: block;
    }

    .f02-queue-edge {
      position: absolute;
      left: 80px;
      top: 192px;
      width: 340px;
      height: 556px;
      border-right: 1px solid #C8BFA8;
    }

    .f02-rule {
      position: absolute;
      left: 470px;
      top: 197px;
      height: 1px;
      width: 530px;
      background: #C8BFA8;
      transform-origin: 0% 50%;
    }

    .f02-deliverable {
      position: absolute;
      left: 470px;
      top: 228px;
      width: 530px;
      display: block;
    }

    .f02-claim {
      position: absolute;
      left: 470px;
      top: 430px;
      width: 530px;
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      font-size: 58px;
      line-height: 1.16;
      letter-spacing: -1.2px;
      color: #1A1712;
    }

    .f02-claim .w {
      display: inline-block;
    }
  </style>

  <div id="root" data-composition-id="02-escrow-holds" data-start="0" data-duration="4.5" data-width="1080" data-height="1080">
    <div id="f02-ground" class="f02-ground clip" data-start="0" data-duration="4.5" data-track-index="0"></div>

    <div id="f02-stage" class="f02-stage clip" data-start="0" data-duration="4.5" data-track-index="1">
      <div class="f02-label" id="f02-label">5 pending</div>

      <div class="f02-queue-mask" id="f02-queue-mask" data-layout-allow-overflow>
        <img src="assets/crop-queue.png" alt="" />
      </div>
      <div class="f02-queue-edge" id="f02-queue-edge"></div>

      <div class="f02-rule" id="f02-rule"></div>
      <img class="f02-deliverable" id="f02-deliverable" src="assets/crop-deliverable.png" alt="" />

      <div class="f02-claim" id="f02-claim">
        <span class="w">The</span> <span class="w">money</span> <span class="w">is</span>
        <span class="w">already</span> <span class="w">escrowed.</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var claimWords = document.querySelectorAll('#f02-claim .w');

      gsap.set('#f02-rule', { scaleX: 0 });
      gsap.set('#f02-queue-edge', { autoAlpha: 0 });

      // Scene 1 (0.0-1.15) — the queue column is uncovered by its own mask, bottom edge up.
      // The panel is drawn at final position; only the mask height moves.
      tl.fromTo(
        '#f02-queue-mask',
        { height: 0, autoAlpha: 1 },
        { height: 556, duration: 0.85, ease: 'power3.out' },
        0.05
      );
      tl.fromTo('#f02-queue-edge', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, 0.6);

      // Scene 2 (1.15-2.1) — the mono micro-label, then the hairline runs right
      // across the empty field to say where the next piece will land.
      tl.fromTo('#f02-label', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 1.15);
      tl.to('#f02-rule', { scaleX: 1, duration: 0.62, ease: 'power3.out' }, 1.42);

      // Scene 3 (2.1-3.1) — the deliverable block arrives along that hairline
      tl.fromTo(
        '#f02-deliverable',
        { autoAlpha: 0, x: 46 },
        { autoAlpha: 1, x: 0, duration: 0.62, ease: 'expo.out' },
        2.12
      );

      // Scene 4 (3.1-4.0) — the claim lands per-word, then everything holds
      tl.fromTo(
        claimWords,
        { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.44, ease: 'power3.out', stagger: 0.055 },
        3.08
      );

      window.__timelines['02-escrow-holds'] = tl;
    })();
  </script>
</template>
