<template>
  <style>
    @font-face {
      font-family: 'Playfair Display';
      src: url('assets/fonts/PlayfairDisplay-var.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Inter';
      src: url('assets/fonts/Inter-var.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      src: url('assets/fonts/IBMPlexMono-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .f03-ground {
      position: absolute;
      inset: 0;
      background: #F5F0E8;
    }

    .f03-stage {
      position: absolute;
      inset: 0;
    }

    /* the real action row — the poster's three choices */
    .f03-actions {
      position: absolute;
      left: 110px;
      top: 140px;
      width: 860px;
      display: block;
    }

    .f03-progress {
      position: absolute;
      left: 110px;
      top: 246px;
      height: 1px;
      width: 860px;
      background: #C8BFA8;
      transform-origin: 0% 50%;
    }

    /* the verdict card grows downward out of the button that summoned it */
    .f03-card-mask {
      position: absolute;
      left: 110px;
      top: 262px;
      width: 860px;
      height: 528px;
      overflow: hidden;
    }

    .f03-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 860px;
      height: 528px;
      background: #E6EEE3;
      border: 1px solid #B8CDB4;
    }

    .f03-eyebrow {
      position: absolute;
      left: 38px;
      top: 34px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #55634F;
    }

    .f03-verdict {
      position: absolute;
      left: 38px;
      top: 86px;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 86px;
      line-height: 1;
      letter-spacing: -2px;
      color: #5A8A5A;
    }

    .f03-score {
      position: absolute;
      right: 38px;
      top: 44px;
      text-align: right;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 116px;
      line-height: 1;
      letter-spacing: -3px;
      color: #5A8A5A;
      font-variant-numeric: tabular-nums;
    }

    .f03-outof {
      position: absolute;
      right: 40px;
      top: 192px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 24px;
      letter-spacing: 1px;
      color: #55634F;
      text-align: right;
    }

    .f03-reasoning {
      position: absolute;
      left: 34px;
      top: 246px;
      width: 792px;
      display: block;
    }

    .f03-strengths {
      position: absolute;
      left: 34px;
      top: 364px;
      width: 792px;
      display: block;
    }
  </style>

  <div id="root" data-composition-id="03-the-verdict" data-start="0" data-duration="6" data-width="1080" data-height="1080">
    <div id="f03-ground" class="f03-ground clip" data-start="0" data-duration="6" data-track-index="0"></div>

    <div id="f03-stage" class="f03-stage clip" data-start="0" data-duration="6" data-track-index="1">
      <img class="f03-actions" id="f03-actions-idle" src="assets/crop-actions.png" alt="" />
      <img class="f03-actions" id="f03-actions-busy" src="assets/crop-arbitrating.png" alt="" />

      <div class="f03-progress" id="f03-progress"></div>

      <div class="f03-card-mask" id="f03-card-mask">
        <div class="f03-card" id="f03-card">
          <div class="f03-eyebrow" id="f03-eyebrow">AI verdict</div>
          <div class="f03-verdict" id="f03-verdict">APPROVE</div>
          <div class="f03-score" id="f03-score">0</div>
          <div class="f03-outof" id="f03-outof">/ 100</div>
          <img class="f03-reasoning" id="f03-reasoning" src="assets/crop-reasoning.png" alt="" />
          <img class="f03-strengths" id="f03-strengths" src="assets/crop-strengths.png" alt="" />
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var scoreEl = document.getElementById('f03-score');
      var counter = { v: 0 };
      var lastPrinted = -1;

      gsap.set('#f03-actions-idle', { autoAlpha: 1 });
      gsap.set('#f03-actions-busy', { autoAlpha: 0 });
      gsap.set('#f03-progress', { scaleX: 0 });
      gsap.set('#f03-card-mask', { height: 0 });
      gsap.set(['#f03-eyebrow', '#f03-verdict', '#f03-score', '#f03-outof'], { autoAlpha: 0 });
      gsap.set(['#f03-reasoning', '#f03-strengths'], { autoAlpha: 0 });

      // Scene 1 (0.0-0.85) — the row lands, then takes a tactile press
      tl.fromTo(
        '#f03-actions-idle',
        { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.42, ease: 'power3.out' },
        0
      );
      tl.to('#f03-actions-idle', { scaleY: 0.972, duration: 0.09, ease: 'power2.in' }, 0.6);
      tl.to('#f03-actions-idle', { scaleY: 1, duration: 0.22, ease: 'power3.out' }, 0.69);

      // Scene 2 (0.85-1.75) — hard state swap into the real "Arbitrating..." button,
      // and a determinate hairline runs beneath it as the wait
      tl.set('#f03-actions-idle', { autoAlpha: 0 }, 0.85);
      tl.set('#f03-actions-busy', { autoAlpha: 1 }, 0.85);
      tl.to('#f03-progress', { scaleX: 1, duration: 0.82, ease: 'none' }, 0.87);

      // Scene 3 (1.75-3.5) — the card expands downward from the row's bottom edge,
      // then the verdict resolves and the score counts up
      tl.set('#f03-actions-busy', { autoAlpha: 0 }, 1.75);
      tl.set('#f03-actions-idle', { autoAlpha: 1 }, 1.75);
      tl.to('#f03-card-mask', { height: 528, duration: 0.66, ease: 'power3.out' }, 1.75);
      tl.fromTo('#f03-eyebrow', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.34, ease: 'power3.out' }, 2.02);
      tl.fromTo('#f03-verdict', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.46, ease: 'power3.out' }, 2.14);
      tl.fromTo('#f03-outof', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, 2.3);

      // the count-up is the payoff — value-scaled, so the figure grows as it climbs
      tl.fromTo('#f03-score', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: 'power2.out' }, 2.28);
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 92,
          duration: 1.16,
          ease: 'power2.out',
          onUpdate: function () {
            var n = Math.round(counter.v);
            if (n === lastPrinted) return; // per-frame text writes flicker under seek
            lastPrinted = n;
            scoreEl.textContent = String(n);
          },
        },
        2.3
      );
      tl.fromTo('#f03-score', { scale: 0.82 }, { scale: 1, duration: 1.16, ease: 'power2.out', transformOrigin: '100% 50%' }, 2.3);

      tl.fromTo('#f03-reasoning', { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 2.86);

      // Scene 4 (3.5-4.4) — the strengths block staggers up beneath
      tl.fromTo('#f03-strengths', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.54, ease: 'power3.out' }, 3.5);

      // Scene 5 (4.4-5.5) — held completely still. No jitter. This silence is
      // what makes frame 4's contradiction land.

      window.__timelines['03-the-verdict'] = tl;
    })();
  </script>
</template>
